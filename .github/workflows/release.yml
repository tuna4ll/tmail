name: Release

# Push a tag such as v0.2.0 to build every platform and publish a release.
# The tag must match the version in Cargo.toml.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

  build:
    name: build ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu keeps the glibc requirement low.
          - name: linux-x86_64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-22.04-arm
            targets: aarch64-unknown-linux-gnu
          # Both Mac builds share one machine: macOS runners are the scarce ones,
          # and a job that waits too long for one is cancelled.
          - name: macos
            os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - name: windows-x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          for target in ${{ matrix.targets }}; do rustup target add "$target"; done
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Build
        shell: bash
        run: |
          for target in ${{ matrix.targets }}; do
            cargo build --locked --release --features static --target "$target"
          done
      - name: Smoke test
        shell: bash
        run: |
          case "$(uname -m)" in arm64 | aarch64) host=aarch64 ;; *) host=x86_64 ;; esac
          for target in ${{ matrix.targets }}; do
            # Binaries for another processor are built, not run.
            case "$target" in "$host"-*) ;; *) continue ;; esac
            "target/$target/release/tmail" --version
            "target/$target/release/tmail" --help > /dev/null
          done
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          for target in ${{ matrix.targets }}; do
            dir="target/$target/release"
            if [ "${{ runner.os }}" = "Windows" ]; then
              asset="tmail-$target.zip"
              cp LICENSE README.md "$dir/"
              (cd "$dir" && 7z a "../../../dist/$asset" tmail.exe LICENSE README.md > /dev/null)
            else
              asset="tmail-$target.tar.gz"
              tar -czf "dist/$asset" -C "$dir" tmail -C "$GITHUB_WORKSPACE" LICENSE README.md
            fi
            (
              cd dist
              if command -v sha256sum > /dev/null; then
                sha256sum "$asset" > "$asset.sha256"
              else
                shasum -a 256 "$asset" > "$asset.sha256"
              fi
              cat "$asset.sha256"
            )
          done
      - uses: actions/upload-artifact@v7
        with:
          name: tmail-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          cat SHA256SUMS
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "tmail $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

  crates:
    name: crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A version is published only once; a re-run of the workflow skips it.
          status="$(curl -s -o /dev/null -w '%{http_code}' -A "tmail release (github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/tmail/$version")"
          if [ "$status" = "200" ]; then
            echo "tmail $version is already on crates.io"
          else
            cargo publish --locked
          fi
