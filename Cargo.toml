[package]
name = "termail"
version = "1.0.0"
description = "A terminal email client with a spatial workspace for conversations."
authors = ["Tuna Kılıç <tuna@tunakilic.com>"]
license = "MIT"
repository = "https://github.com/tuna4ll/termail"
readme = "README.md"
keywords = ["email", "mail", "imap", "tui", "terminal"]
categories = ["command-line-utilities", "email"]
exclude = ["docs/demo.gif", "sandbox/", ".github/", "install.sh", "install.ps1"]
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.32"
email_address = "0.2.9"
mail-builder = "0.4.4"
mail-parser = "0.11.9"
imap = { version = "=3.0.0-alpha.15", default-features = false, features = ["native-tls"] }
imap-proto = "0.16"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "native-tls"] }
native-tls = "0.2.14"
mime_guess = "2.0.5"
opener = "0.8.5"
rataflow = "0.1.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.6"
toml_edit = "0.22.27"
zeroize = "1.9.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
unicode-width = "0.2"
ego-tree = "0.11"
scraper = { version = "0.29", default-features = false }
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "html"] }
flate2 = "1"

[features]
# Builds OpenSSL and libdbus into the binary, so a release runs on any Linux
# without matching library versions. No effect on macOS and Windows.
static = ["native-tls/vendored", "keyring/vendored"]

[dev-dependencies]
rcgen = "0.14.5"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
